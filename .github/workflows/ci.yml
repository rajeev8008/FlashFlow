name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: pip install -e 'apps/api[test]' ruff==0.14.0
      - run: ruff check apps/api --select E9,F63,F7,F82
      - run: pytest -q apps/api/tests
      - run: npm ci && npm test && npm run lint
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
