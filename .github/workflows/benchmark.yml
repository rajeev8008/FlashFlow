name: Manual performance run
on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [pipeline, load, frontend]
        default: pipeline
      seconds:
        default: '180'
      rates:
        default: '100 500 1000 2000'
      consumers:
        type: choice
        options: ['1', '2', '3']
        default: '1'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONSUMER_INSTANCES: ${{ inputs.consumers }}
      RUN_SECONDS: ${{ inputs.seconds }}
      RUN_RATES: ${{ inputs.rates }}
      RUN_KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: docker compose up -d --build --wait api frontend
      - if: inputs.kind == 'pipeline'
        run: docker compose exec -T api python tests/pipeline_benchmark.py --rates $RUN_RATES --seconds "$RUN_SECONDS" > docs/benchmarks/ci-pipeline.json
      - if: inputs.kind == 'load'
        run: |
          docker compose up -d simulator
          docker compose exec -T api python tests/load_probe.py --clients 1 10 50 100 --seconds 60 > docs/benchmarks/ci-load.json
      - if: inputs.kind == 'frontend'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BENCH_SECONDS="$RUN_SECONDS" npm run benchmark
        working-directory: apps/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-performance
          path: docs/benchmarks/
      - if: always()
        run: docker compose down
