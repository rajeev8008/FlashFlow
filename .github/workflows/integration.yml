name: Integration
on:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      ENABLE_CHAOS: 'true'
      ENABLE_RETAIL_CONTROLS: 'true'
      CHAOS_TOKEN: local-ci-controls-only
      CONSUMER_INSTANCES: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: docker compose up -d --build --wait api frontend simulator forecast
      - run: |
          docker compose exec -T api python tests/integration_phase2.py
          docker compose exec -T api python tests/integration_pricing.py
          docker compose exec -T api python tests/integration_pipeline.py
          docker compose restart api
          docker compose up -d --wait api
          docker compose exec -T api python tests/integration_phase2.py --restart-check
          docker compose exec -T api python tests/integration_resilience.py
          docker compose exec -T api python tests/integration_retail.py
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/frontend
        env:
          LIVE_STACK: '1'
          CHAOS_TEST: '1'
      - if: failure()
        run: docker compose logs --tail 100 api frontend simulator
      - if: always()
        run: docker compose down
